services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: warframe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kolkoparatolkomuzike
      POSTGRES_DB: WarframeLFGBoardDb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warframe-network

  # RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: warframe-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warframe-network

  # UsersDirectory Microservice
  users-directory:
    build:
      context: ./backend/UsersDirectory
      dockerfile: Dockerfile
    container_name: warframe-users-directory
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WarframeLFGBoardDb;Username=postgres;Password=kolkoparatolkomuzike"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warframe-network

  # ItemsStore Microservice
  items-store:
    build:
      context: ./backend/ItemsStore
      dockerfile: Dockerfile
    container_name: warframe-items-store
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WarframeLFGBoardDb;Username=postgres;Password=kolkoparatolkomuzike"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warframe-network

  # GroupRequests Microservice
  group-requests:
    build:
      context: ./backend/GroupRequests
      dockerfile: Dockerfile
    container_name: warframe-group-requests
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WarframeLFGBoardDb;Username=postgres;Password=kolkoparatolkomuzike"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warframe-network

  # Audit Microservice
  audit:
    build:
      context: ./backend/Audit
      dockerfile: Dockerfile
    container_name: warframe-audit
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WarframeLFGBoardDb;Username=postgres;Password=kolkoparatolkomuzike"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warframe-network

  # UserNotification Microservice
  user-notification:
    build:
      context: ./backend/UserNotification
      dockerfile: Dockerfile
    container_name: warframe-user-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WarframeLFGBoardDb;Username=postgres;Password=kolkoparatolkomuzike"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8005:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warframe-network

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warframe-frontend
    ports:
      - "3000:80"
    depends_on:
      users-directory:
        condition: service_started
      items-store:
        condition: service_started
      group-requests:
        condition: service_started
      audit:
        condition: service_started
      user-notification:
        condition: service_started
    networks:
      - warframe-network

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8090:8080"
    networks:
      - warframe-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  warframe-network:
    driver: bridge
